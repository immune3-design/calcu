<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Casio JS-20 Pastel Edition</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pastel: {
                            bgGradStart: '#fce7f3', // Soft pink top
                            bgGradEnd: '#e0e7ff',   // Soft indigo bottom
                            frame: '#ffffff',       // Stylish glossy body
                            lcd: '#f1f5f9',         // Very soft slate screen background
                            lcdText: '#334155',     // Deep slate display text
                            btnNum: '#fff5f7',      // Soft pastel cream pink
                            btnNumText: '#475569',  // Readable dark grey
                            btnMem: '#ede9fe',      // Pastel lavender (MC, MR, M-, M+)
                            btnMemText: '#6d28d9',
                            btnOp: '#f1f5f9',       // Pale neutral slate (÷, ×, -, +, ±, BS)
                            btnOpText: '#475569',
                            btnCoral: '#ffe4e6',    // Soft pastel coral (C, AC)
                            btnCoralText: '#e11d48',
                            btnBlue: '#dbeafe',     // Soft pastel blue (=)
                            btnBlueText: '#2563eb'
                        }
                    },
                    fontFamily: {
                        lcd: ['"Digital-7"', 'Courier New', 'monospace'],
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        /* Touch safety for mobile browsers */
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        @font-face {
            font-family: 'Digital-7';
            src: url('https://cdnjs.cloudflare.com/ajax/libs/ink/3.1.10/fonts/digital-7.ttf') format('truetype');
        }

        .lcd-display {
            font-family: 'Digital-7', 'Courier New', monospace;
            text-shadow: 0 0 1px rgba(51, 65, 85, 0.15);
        }

        /* Tactile Key Press Effect */
        .btn-calc {
            transition: all 0.08s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(148, 163, 184, 0.25), 0 2px 4px -2px rgba(148, 163, 184, 0.2);
        }

        .btn-calc:active {
            transform: translateY(2px) scale(0.97);
            box-shadow: 0 1px 2px 0 rgba(148, 163, 184, 0.2);
            filter: brightness(0.96);
        }

        /* Hide scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gradient-to-br from-pastel-bgGradStart via-pink-100 to-pastel-bgGradEnd min-h-screen flex items-center justify-center p-0 font-sans select-none overflow-hidden">

    <!-- Compact Floating Frame with zero wasted space -->
    <div class="calc-container w-full h-full max-w-[380px] max-h-[680px] min-h-screen sm:min-h-0 bg-pastel-frame/95 backdrop-blur-md rounded-2xl p-2 sm:p-3 shadow-2xl border border-white/80 flex flex-col justify-between my-auto">
        
        <!-- Header Logo (Compact) -->
        <div class="flex items-center justify-between px-1.5 pt-0.5 pb-1">
            <span class="text-[10px] font-black tracking-widest text-slate-400 uppercase">CASIO <span class="text-pink-400 font-normal">JS-20</span></span>
        </div>

        <!-- LCD Screen Frame -->
        <div class="bg-pastel-lcd rounded-xl px-2.5 py-1.5 shadow-inner border border-slate-200/80 flex flex-col justify-between h-20 sm:h-24 relative overflow-hidden mb-1.5 flex-shrink-0">
            <!-- Upper Indicators Bar -->
            <div class="flex justify-between items-center text-slate-400 text-[10px] font-extrabold tracking-wider">
                <div class="flex items-center gap-1.5">
                    <span id="ind-m" class="opacity-15 text-purple-600 transition-opacity">M</span>
                    <span id="ind-k" class="opacity-15 text-pink-500 font-black bg-pink-100 px-1 py-0.2 rounded text-[9px] transition-opacity">K</span>
                    <span id="ind-gt" class="opacity-15 transition-opacity">GT</span>
                </div>
                <div class="flex items-center gap-1">
                    <span id="ind-sign" class="text-xs font-black opacity-15 transition-opacity">-</span>
                    <span id="ind-op" class="font-extrabold text-[10px] text-slate-500"></span>
                </div>
            </div>

            <!-- Main Display Value -->
            <div class="text-right overflow-x-auto no-scrollbar whitespace-nowrap leading-none flex items-end justify-end h-full pb-0.5">
                <span id="display" class="lcd-display text-3xl sm:text-4xl font-extrabold text-pastel-lcdText tracking-tight">0.</span>
            </div>
        </div>

        <!-- 5 x 5 Keypad Grid (Maximizing touch targets for small screens) -->
        <div class="grid grid-cols-5 gap-1.5 flex-1 w-full items-stretch">
            <!-- Row 1: [MC] [MR] [M-] [M+] [C] -->
            <button onclick="handleKey('MC')" class="btn-calc bg-pastel-btnMem text-pastel-btnMemText font-bold rounded-xl text-xs sm:text-sm flex items-center justify-center">MC</button>
            <button onclick="handleKey('MR')" class="btn-calc bg-pastel-btnMem text-pastel-btnMemText font-bold rounded-xl text-xs sm:text-sm flex items-center justify-center">MR</button>
            <button onclick="handleKey('M-')" class="btn-calc bg-pastel-btnMem text-pastel-btnMemText font-bold rounded-xl text-xs sm:text-sm flex items-center justify-center">M-</button>
            <button onclick="handleKey('M+')" class="btn-calc bg-pastel-btnMem text-pastel-btnMemText font-bold rounded-xl text-xs sm:text-sm flex items-center justify-center">M+</button>
            <button onclick="handleKey('C')"  class="btn-calc bg-pastel-btnCoral text-pastel-btnCoralText font-black rounded-xl text-sm sm:text-base flex items-center justify-center">C</button>

            <!-- Row 2: [±] [7] [8] [9] [÷] -->
            <button onclick="handleKey('±')" class="btn-calc bg-pastel-btnOp text-pastel-btnOpText font-bold rounded-xl text-sm sm:text-base flex items-center justify-center">±</button>
            <button onclick="handleKey('7')" class="btn-calc bg-pastel-btnNum text-pastel-btnNumText font-bold rounded-xl text-base sm:text-lg flex items-center justify-center">7</button>
            <button onclick="handleKey('8')" class="btn-calc bg-pastel-btnNum text-pastel-btnNumText font-bold rounded-xl text-base sm:text-lg flex items-center justify-center">8</button>
            <button onclick="handleKey('9')" class="btn-calc bg-pastel-btnNum text-pastel-btnNumText font-bold rounded-xl text-base sm:text-lg flex items-center justify-center">9</button>
            <button onclick="handleKey('÷')" class="btn-calc bg-pastel-btnOp text-pastel-btnOpText font-bold rounded-xl text-lg sm:text-xl flex items-center justify-center">÷</button>

            <!-- Row 3: [BS] [4] [5] [6] [×] -->
            <button onclick="handleKey('BS')" class="btn-calc bg-pastel-btnOp text-pastel-btnOpText font-bold rounded-xl text-base flex items-center justify-center">
                <svg class="w-4 h-4 sm:w-5 sm:h-5 fill-current" viewBox="0 0 24 24">
                    <path d="M22,3H7C6.31,3 5.77,3.35 5.41,3.88L0,12L5.41,20.11C5.77,20.64 6.31,21 7,21H22A2,2 0 0,0 24,19V5A2,2 0 0,0 22,3M19,15.59L17.59,17L14,13.41L10.41,17L9,15.59L12.59,12L9,8.41L10.41,7L14,10.59L17.59,7L19,8.41L15.41,12L19,15.59Z"/>
                </svg>
            </button>
            <button onclick="handleKey('4')" class="btn-calc bg-pastel-btnNum text-pastel-btnNumText font-bold rounded-xl text-base sm:text-lg flex items-center justify-center">4</button>
            <button onclick="handleKey('5')" class="btn-calc bg-pastel-btnNum text-pastel-btnNumText font-bold rounded-xl text-base sm:text-lg flex items-center justify-center">5</button>
            <button onclick="handleKey('6')" class="btn-calc bg-pastel-btnNum text-pastel-btnNumText font-bold rounded-xl text-base sm:text-lg flex items-center justify-center">6</button>
            <button onclick="handleKey('×')" class="btn-calc bg-pastel-btnOp text-pastel-btnOpText font-bold rounded-xl text-lg sm:text-xl flex items-center justify-center">×</button>

            <!-- Row 4: [AC] [1] [2] [3] [-] -->
            <button onclick="handleKey('AC')" class="btn-calc bg-pastel-btnCoral text-pastel-btnCoralText font-black rounded-xl text-xs sm:text-sm flex items-center justify-center">AC</button>
            <button onclick="handleKey('1')"  class="btn-calc bg-pastel-btnNum text-pastel-btnNumText font-bold rounded-xl text-base sm:text-lg flex items-center justify-center">1</button>
            <button onclick="handleKey('2')"  class="btn-calc bg-pastel-btnNum text-pastel-btnNumText font-bold rounded-xl text-base sm:text-lg flex items-center justify-center">2</button>
            <button onclick="handleKey('3')"  class="btn-calc bg-pastel-btnNum text-pastel-btnNumText font-bold rounded-xl text-base sm:text-lg flex items-center justify-center">3</button>
            <button onclick="handleKey('-')"  class="btn-calc bg-pastel-btnOp text-pastel-btnOpText font-bold rounded-xl text-lg sm:text-xl flex items-center justify-center">-</button>

            <!-- Row 5: [0] [00] [.] [=] [+] -->
            <button onclick="handleKey('0')"  class="btn-calc bg-pastel-btnNum text-pastel-btnNumText font-bold rounded-xl text-base sm:text-lg flex items-center justify-center">0</button>
            <button onclick="handleKey('00')" class="btn-calc bg-pastel-btnNum text-pastel-btnNumText font-bold rounded-xl text-xs sm:text-base flex items-center justify-center">00</button>
            <button onclick="handleKey('.')"  class="btn-calc bg-pastel-btnNum text-pastel-btnNumText font-bold rounded-xl text-base sm:text-lg flex items-center justify-center">.</button>
            <button onclick="handleKey('=')"  class="btn-calc bg-pastel-btnBlue text-pastel-btnBlueText font-black rounded-xl text-lg sm:text-xl flex items-center justify-center">=</button>
            <button onclick="handleKey('+')"  class="btn-calc bg-pastel-btnOp text-pastel-btnOpText font-bold rounded-xl text-lg sm:text-xl flex items-center justify-center">+</button>
        </div>
    </div>

    <!-- Core Calculator Logic -->
    <script>
        // State Management
        let currentInput = "0";
        let previousInput = null;
        let pendingOperator = null;
        let constantValue = null;
        let constantOp = null;
        let isKMode = false;
        let memory = 0;
        let grandTotal = 0;
        let isNewInput = true;
        let lastOpPressed = null;
        let lastKTerm = null;

        // Elements
        const displayEl = document.getElementById("display");
        const indM = document.getElementById("ind-m");
        const indK = document.getElementById("ind-k");
        const indGT = document.getElementById("ind-gt");
        const indSign = document.getElementById("ind-sign");
        const indOp = document.getElementById("ind-op");

        // Touch Feedback
        function triggerHaptic() {
            if ("vibrate" in navigator) {
                try { navigator.vibrate(8); } catch(e){}
            }
        }

        // Render Display
        function updateDisplay() {
            let num = parseFloat(currentInput);

            // Minus Indicator
            if (num < 0) {
                indSign.classList.remove("opacity-15");
            } else {
                indSign.classList.add("opacity-15");
            }

            let absoluteStr = Math.abs(num).toString();

            // Format to 12 digits max
            if (absoluteStr.length > 12 && !absoluteStr.includes('e')) {
                if (Number.isInteger(num)) {
                    absoluteStr = num.toPrecision(12);
                } else {
                    let parts = absoluteStr.split('.');
                    let decs = 11 - parts[0].length;
                    if (decs > 0) {
                        absoluteStr = parseFloat(num.toFixed(decs)).toString();
                    } else {
                        absoluteStr = num.toPrecision(10);
                    }
                }
            }

            // Casio Display trailing dot simulation
            let formattedDisplay = absoluteStr === "NaN" ? "E" : absoluteStr;
            if (!formattedDisplay.includes('.') && absoluteStr !== "E") {
                formattedDisplay += ".";
            }

            displayEl.innerText = formattedDisplay;

            // Indicator State
            indM.style.opacity = (memory !== 0) ? "1" : "0.15";
            indK.style.opacity = isKMode ? "1" : "0.15";
            indGT.style.opacity = (grandTotal !== 0) ? "1" : "0.15";
            indOp.innerText = pendingOperator ? pendingOperator : "";
        }

        // Math Execution Logic
        function executeOperation(a, b, op) {
            switch (op) {
                case '+': return a + b;
                case '-': return a - b;
                case '×': return a * b;
                case '÷': return b === 0 ? NaN : a / b;
                default: return b;
            }
        }

        // Key Press Router
        function handleKey(key) {
            triggerHaptic();

            // Digits 0-9
            if (/^[0-9]$/.test(key)) {
                if (isNewInput || currentInput === "0") {
                    currentInput = key;
                    isNewInput = false;
                } else {
                    if (currentInput.replace('.', '').replace('-', '').length < 12) {
                        currentInput += key;
                    }
                }
                lastOpPressed = null;
            }
            // Double Zero '00'
            else if (key === '00') {
                if (!isNewInput && currentInput !== "0") {
                    if (currentInput.replace('.', '').replace('-', '').length <= 10) {
                        currentInput += "00";
                    }
                }
                lastOpPressed = null;
            }
            // Decimal Point '.'
            else if (key === '.') {
                if (isNewInput) {
                    currentInput = "0.";
                    isNewInput = false;
                } else if (!currentInput.includes('.')) {
                    currentInput += ".";
                }
                lastOpPressed = null;
            }
            // Backspace / Delete
            else if (key === 'BS') {
                if (!isNewInput) {
                    if (currentInput.length > 1) {
                        currentInput = currentInput.slice(0, -1);
                        if (currentInput === "-" || currentInput === "") currentInput = "0";
                    } else {
                        currentInput = "0";
                    }
                }
            }
            // Plus / Minus Sign Invert
            else if (key === '±') {
                let val = parseFloat(currentInput);
                if (val !== 0) {
                    currentInput = (-val).toString();
                }
            }
            // Operators (+, -, ×, ÷)
            else if (['+', '-', '×', '÷'].includes(key)) {
                let val = parseFloat(currentInput);

                // Double Operator Tap sets Casio K-Mode
                if (lastOpPressed === key) {
                    isKMode = true;
                    constantOp = key;
                    constantValue = val;
                } else {
                    if (pendingOperator && !isNewInput) {
                        val = executeOperation(previousInput, val, pendingOperator);
                        currentInput = val.toString();
                    }
                    previousInput = val;
                }

                pendingOperator = key;
                lastOpPressed = key;
                isNewInput = true;
                lastKTerm = null;
            }
            // Equals (=)
            else if (key === '=') {
                let val = parseFloat(currentInput);

                if (isKMode && constantOp && constantValue !== null) {
                    let res = executeOperation(val, constantValue, constantOp);
                    currentInput = res.toString();
                    grandTotal += res;
                } else if (pendingOperator && previousInput !== null) {
                    let res = executeOperation(previousInput, val, pendingOperator);
                    currentInput = res.toString();
                    grandTotal += res;
                    pendingOperator = null;
                }

                isNewInput = true;
                lastOpPressed = null;
                lastKTerm = null;
            }
            // Memory Plus (M+) - ANNUITY PRESENT VALUE FEATURE
            else if (key === 'M+') {
                let val = parseFloat(currentInput);

                if (isKMode && constantOp && constantValue !== null) {
                    let termToAdd;
                    if (lastKTerm === null) {
                        termToAdd = executeOperation(val, constantValue, constantOp);
                    } else {
                        termToAdd = executeOperation(lastKTerm, constantValue, constantOp);
                    }

                    memory += termToAdd;
                    currentInput = termToAdd.toString();
                    lastKTerm = termToAdd;
                } else {
                    if (pendingOperator && previousInput !== null && !isNewInput) {
                        val = executeOperation(previousInput, val, pendingOperator);
                        pendingOperator = null;
                    }
                    memory += val;
                    currentInput = val.toString();
                }

                isNewInput = true;
                lastOpPressed = null;
            }
            // Memory Minus (M-)
            else if (key === 'M-') {
                let val = parseFloat(currentInput);

                if (isKMode && constantOp && constantValue !== null) {
                    let termToSub;
                    if (lastKTerm === null) {
                        termToSub = executeOperation(val, constantValue, constantOp);
                    } else {
                        termToSub = executeOperation(lastKTerm, constantValue, constantOp);
                    }

                    memory -= termToSub;
                    currentInput = termToSub.toString();
                    lastKTerm = termToSub;
                } else {
                    if (pendingOperator && previousInput !== null && !isNewInput) {
                        val = executeOperation(previousInput, val, pendingOperator);
                        pendingOperator = null;
                    }
                    memory -= val;
                    currentInput = val.toString();
                }

                isNewInput = true;
                lastOpPressed = null;
            }
            // Memory Recall (MR)
            else if (key === 'MR') {
                currentInput = memory.toString();
                isNewInput = true;
                lastOpPressed = null;
            }
            // Memory Clear (MC)
            else if (key === 'MC') {
                memory = 0;
                lastOpPressed = null;
            }
            // Clear Entry (C)
            else if (key === 'C') {
                currentInput = "0";
                isNewInput = true;
                lastOpPressed = null;
            }
            // All Clear (AC)
            else if (key === 'AC') {
                currentInput = "0";
                previousInput = null;
                pendingOperator = null;
                constantValue = null;
                constantOp = null;
                isKMode = false;
                isNewInput = true;
                lastOpPressed = null;
                lastKTerm = null;
            }

            updateDisplay();
        }

        // Toggle Modal
        function toggleHelpModal(show) {
            const modal = document.getElementById("help-modal");
            if (show) modal.classList.remove("hidden");
        }

        // Physical Keyboard Events
        window.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') handleKey(e.key);
            else if (e.key === '.') handleKey('.');
            else if (e.key === '+') handleKey('+');
            else if (e.key === '-') handleKey('-');
            else if (e.key === '*') handleKey('×');
            else if (e.key === '/') { e.preventDefault(); handleKey('÷'); }
            else if (e.key === 'Enter' || e.key === '=') handleKey('=');
            else if (e.key === 'Backspace') handleKey('BS');
            else if (e.key === 'Escape') handleKey('AC');
        });

        // Initialize Display
        updateDisplay();
    </script>
</body>
</html>
